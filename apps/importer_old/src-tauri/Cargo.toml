[package]
# The binary is `frost-importer.exe`.
name = "frost-importer"
version = "0.1.2"
description = "Frost Importer: MX Bikes models to Blender"
authors = ["Frost"]
edition = "2021"

# Its own workspace: it is placed into an mxb-app checkout at build time (see ../sync.ps1) and
# is never one of that workspace's members.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The pkz reader MXB App uses (`mxb_core::pkz`): plain zips, and creator-locked ones in memory
# when the private reader is in the checkout (../../sync.ps1 places it).
mxb-core = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
