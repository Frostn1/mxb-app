[package]
name = "mxb-servers"
version = "0.1.0"
description = "MXB Servers — status, riders and logs for your mxbserver fleet"
authors = ["Frost"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native servers use loopback SSH tunnels; Legacy connecting may call an HTTPS mxb-agent.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
getrandom = "0.3"
# Admin tokens live in the OS keychain (Windows Credential Manager, macOS Keychain);
# servers.json holds only where a server is. On Linux `linux-native` is the kernel session
# keyring, which forgets tokens at logout; a persistent Secret Service backend needs libdbus,
# so it waits until Linux is a target (the bundle is Windows-only).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
# Config editing: change typed fields in a server's TOML without losing its comments or
# layout, show the change as a line diff, and move the candidate over SSH as one word.
toml_edit = "0.22"
similar = "2"
base64 = "0.22"
sha2 = "0.10"
minisign-verify = "0.2"
mxb-content = { path = "../../../crates/content" }

[features]
custom-protocol = ["tauri/custom-protocol"]
