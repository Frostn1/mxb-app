[package]
name = "mxb-servers"
version = "0.1.0"
description = "MXB Servers — status, riders and logs for your mxbserver fleet"
authors = ["Frost"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Talks only to 127.0.0.1 through the SSH tunnels this app opens, so no TLS is needed yet;
# rustls is kept for the direct-HTTPS transport the plan adds with server-side TLS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
getrandom = "0.3"
# Admin tokens live in the OS keychain (Windows Credential Manager, macOS Keychain, the Linux
# kernel keyring); servers.json holds only where a server is.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
