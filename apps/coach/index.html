<!doctype html>
<!-- The skin is on the root so Radix portals get it too. -->
<html lang="en" class="coach-skin">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coach</title>
    <!-- Sets the theme class before first paint, so a light or system-light pick never
         flashes dark. Mirrors ThemeProvider (key "frost-theme", default system). -->
    <script>
      try {
        var v = localStorage.getItem("frost-theme");
        var dark = v === "dark" || (v !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
