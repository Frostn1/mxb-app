[package]
# Cargo target names cannot hold a space, so this is as close to `mainBinaryName` as it
# gets. The description is what Windows Task Manager shows in its Processes tab.
name = "mxb-coach"
version = "0.1.9"
description = "MXB Coach — lap-time coaching for MX Bikes"
authors = ["Frost"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mxb-core = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs-next = "2.0.0"
# Fetching the recorder plugin from the FrostMod release. Same build as the other apps'.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[features]
# Matches the other apps'. `tauri build` turns it on; a dev run leaves it off.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Tauri's mock runtime, for tests that need an app handle. Dev-only.
tauri = { version = "2", features = ["test"] }
