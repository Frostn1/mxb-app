<!doctype html>
<!-- The skin is on the root, not on a wrapper: Radix portals every menu, select,
     tooltip and toast onto document.body, and a wrapper div does not contain them. -->
<html lang="en" class="studio-skin">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frost's Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
