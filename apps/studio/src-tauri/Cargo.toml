[package]
# Cargo target names cannot hold a space, so this is as close to `mainBinaryName` as it
# gets. The description is what Windows Task Manager shows in its Processes tab.
name = "mxb-studio"
version = "0.1.0"
description = "Frost's Studio — MX Bikes content studio"
authors = ["Frost"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The shared core. Everything this app can currently do comes from here — which is the
# point of standing the skeleton up before the studio's own code moves in.
mxb-core = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = "2"
flate2 = "1"
walkdir = "2"
rayon = "1"
md-5 = "0.10"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "cookies",
    "gzip",
    "brotli",
    # Preset bundles upload as a multipart form.
    "multipart",
] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
percent-encoding = "2"
base64 = "0.22"
dirs-next = "2.0.0"
regex = "1"
chacha20poly1305 = "0.10"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
    "bmp",
    "webp",
    "gif",
] }

[features]
# Matches the manager's. `tauri build` turns it on; a dev run leaves it off.
custom-protocol = ["tauri/custom-protocol"]
