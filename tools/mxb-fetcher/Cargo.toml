[package]
name = "mxb-fetcher"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fetches what answers Cloudflare Workers 403 (mxb-mods.com pages, MediaFire) for the mod mirror"
license = "MIT"

# Not a member of the repo's workspace (see the root Cargo.toml `exclude`): it builds on a bare
# Linux box with `cargo build --release` from this directory, without the apps' dependencies.

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
regex = "1"
# rustls: no OpenSSL to install on the box. gzip/brotli: a client claiming to be a browser that
# sends no Accept-Encoding looks nothing like one.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "cookies",
    "gzip",
    "brotli",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
