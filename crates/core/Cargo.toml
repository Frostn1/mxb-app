[package]
name = "mxb-core"
version = "0.14.0"
description = "Shared core: the game's file formats and the model pipeline both apps read."
authors = ["Frost"]
edition = "2021"

# Declaring a `links` key is what lets this crate publish `cargo::metadata` to the crates
# that depend on it. `apps/manager` needs one fact from here — whether the optional local
# module is present — because after the move only this crate holds the file, and a build
# script can only see its own tree.
links = "mxbcore"

[build-dependencies]

[dependencies]
anyhow = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No feature list: the tray and the PNG icon belong to an app shell, not to this crate.
# Cargo unifies features across the graph, so the manager still gets its own.
tauri = "2"
walkdir = "2"
rayon = "1"
notify = "6"
notify-debouncer-mini = "0.4"
md-5 = "0.10"
# webp and gif are the remote-thumbnail formats (imgcache) and are not needed to read a
# game asset; kept for now so the manager's feature set is unchanged, and droppable once
# imgcache is the only consumer.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
    "bmp",
    "webp",
    "gif",
] }
zip = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "cookies",
    "gzip",
    "brotli",
    # Preset bundles upload as a multipart form.
    "multipart",
] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
uuid = { version = "1", features = ["v4"] }
trash = "5"
base64 = "0.22"
log = "0.4"
dirs-next = "2.0.0"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[dev-dependencies]
# Tauri's mock runtime, so paintwatch's watcher lifecycle can be exercised without a display
# or a real webview. Dev-only, so the shipped binaries never get the `test` feature.
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
# `library::move_to_trash` calls NSFileManager directly: the `trash` crate drives Finder over
# AppleScript on macOS, and Finder refuses a file iCloud has evicted (error -8013), which is
# exactly what a mods folder under Documents is full of.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSError", "NSString"] }
