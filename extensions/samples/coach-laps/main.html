<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coach Laps (background)</title>
  </head>
  <body>
    <script>
      // Background page: answers the `best_laps` AI tool from MXB Coach's sessions.
      mxb.mcp.handle("best_laps", async () => {
        const best = new Map();
        for (const s of await mxb.coach.sessions()) {
          if (s.cleanLaps.length === 0) continue;
          const k = `${s.track} / ${s.bike}`;
          const e = best.get(k) ?? { track: s.track, bike: s.bike, bestMs: Infinity, cleanLaps: 0 };
          e.bestMs = Math.min(e.bestMs, ...s.cleanLaps);
          e.cleanLaps += s.cleanLaps.length;
          best.set(k, e);
        }
        return [...best.values()].sort((a, b) => a.bestMs - b.bestMs);
      });
    </script>
  </body>
</html>
