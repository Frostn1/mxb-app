<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 20px 28px 40px; color: var(--foreground); font: 13px system-ui, "Segoe UI", sans-serif; background: transparent; }
      header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
      h1 { margin: 0; font-size: 18px; font-weight: 650; }
      h2 { margin: 22px 0 6px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); }
      .muted { color: var(--muted-foreground); }
      .row { display: grid; grid-template-columns: 1fr 160px 70px; gap: 14px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--border); }
      .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub { color: var(--muted-foreground); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bar { height: 6px; border-radius: 3px; background: color-mix(in oklab, var(--foreground) 12%, transparent); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--primary); }
      .bar.hot > i { background: var(--success); }
      .count { text-align: right; font-variant-numeric: tabular-nums; }
      .friend { display: flex; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--border); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
      .words { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .chip { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted-foreground); }
    </style>
    <script src="../watch.js"></script>
  </head>
  <body>
    <header><h1>Server Watcher</h1><span id="sub" class="muted"></span></header>
    <div id="words" class="words"></div>
    <h2>Friends riding now</h2>
    <div id="friends"></div>
    <h2>Watched servers</h2>
    <div id="servers"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      };

      async function render() {
        const s = await mxb.settings.get();
        const words = watchWords(s.tracks);
        const min = Math.max(1, Number(s.minRiders) || 10);
        $("words").replaceChildren(
          ...(words.length ? words : ["every track"]).map((w) => el("span", "chip", w)),
          el("span", "chip", `alert at ${min}+ riders`),
        );

        let servers = [];
        try {
          servers = (await mxb.servers.list()).filter((x) => isWatched(x, words) && !x.passworded);
        } catch (e) {
          $("servers").replaceChildren(el("p", "muted", String(e.message || e)));
        }
        servers.sort((a, b) => b.players - a.players);
        $("sub").textContent = `${servers.length} servers match · checks every minute in the background`;
        $("servers").replaceChildren(
          ...servers.slice(0, 25).map((x) => {
            const r = el("div", "row");
            const who = el("div");
            who.append(el("div", "name", x.name), el("div", "sub", `${x.track} · ${x.location || "?"} · ${x.session || ""}`));
            const bar = el("div", x.players >= min ? "bar hot" : "bar");
            const fill = el("i");
            fill.style.width = `${Math.min(100, (100 * x.players) / Math.max(1, x.maxPlayers))}%`;
            bar.append(fill);
            r.append(who, bar, el("div", "count", `${x.players}/${x.maxPlayers}`));
            return r;
          }),
        );

        try {
          const friends = (await mxb.friends.list()).filter((f) => f.online);
          $("friends").replaceChildren(
            ...(friends.length
              ? friends.map((f) => {
                  const r = el("div", "friend");
                  r.append(el("span", "dot"), el("span", "name", f.name), el("span", "sub", f.server ? `${f.server}${f.track ? ` · ${f.track}` : ""}` : "online"));
                  return r;
                })
              : [el("p", "muted", "Nobody's riding right now.")]),
          );
        } catch (e) {
          $("friends").replaceChildren(el("p", "muted", "Friends presence isn't allowed for this extension."));
        }
      }

      mxb.settings.onChange(render);
      render();
      setInterval(render, 30_000);
    </script>
  </body>
</html>
