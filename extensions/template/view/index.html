<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 24px; color: var(--foreground); font: 13px system-ui, sans-serif; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
      button { background: var(--primary); color: var(--primary-foreground); border: 0; border-radius: var(--radius); padding: 6px 14px; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="title">My tab</h2>
      <p id="game">Checking the game…</p>
      <button id="hi" type="button">Say hello</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
