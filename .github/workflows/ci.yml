name: CI

# Verification on every push to main and every PR. Release builds (release.yml) only
# run on a tag, so without this nothing checks a change before it lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # bun installs the workspace from bun.lock, and tauri-action runs the app's
      # beforeBuildCommand (`bun run build`) with it too.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Enforce secure-content boundary
        run: bun run check:secure-boundary

      - name: No ban GUIDs in the public repo
        run: bun run check:no-ban-guids

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: MXB Servers frontend tests
        run: bun run --filter @frost/servers test

      - name: Build
        run: bun run build

      # `generate_handler!` takes a token list, so a command dropped from it is not a build
      # error — it is a runtime "command not found" on whichever screen needs it. Nothing
      # else in this pipeline can see that, and moving commands between crates is exactly
      # what invites it.
      - name: Command census
        run: bash scripts/command-census.sh

  # MXB Servers' config editing runs remote.sh on the server over SSH. This runs it for real
  # against a bare-process layout like Lightsail's today, with a stub standing in for mxbserver.
  servers-remote:
    name: MXB Servers remote script
    runs-on: ubuntu-latest
    # It restarts processes; a hang must fail fast, not hold a runner for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck apps/servers/src-tauri/src/remote.sh apps/servers/src-tauri/tests/remote/test.sh apps/servers/src-tauri/tests/remote/ssh.sh
      # Output to a file, not the step's own pipes: run straight on them the test sometimes
      # hangs after a restart (never under SSH, never with a file; see ssh.sh for the real path).
      - name: Apply, roll back and refuse against a stub server
        run: |
          rc=0
          bash apps/servers/src-tauri/tests/remote/test.sh > remote-test.log 2>&1 || rc=$?
          cat remote-test.log
          exit $rc
      - name: The same over real SSH, as the app runs it
        run: |
          rc=0
          bash apps/servers/src-tauri/tests/remote/ssh.sh > remote-ssh.log 2>&1 || rc=$?
          cat remote-ssh.log
          exit $rc

  rust:
    name: Rust (test) — ${{ matrix.platform }} — ${{ matrix.shard.name }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the quick check; Windows is what ships, so it must pass there too.
        platform: [ubuntu-latest, windows-latest]
        # The studio's track tests were ~95% of this job: 820 s of synthesis and terrain noise
        # on a 4-core runner. So they run as three jobs, split by measured time. Every shard
        # compiles the same thing, so they share one cache; only the test filter differs.
        # `rest` skips what the other two run, so a new module lands there rather than nowhere.
        shard:
          - name: synth
            filter: "tracksynth::"
          - name: layout
            filter: "tracklayout:: trackllm::"
          - name: rest
            filter: "--skip tracksynth:: --skip tracklayout:: --skip trackllm::"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cargo fmt --check` gate: the tree has never been rustfmt'd (~170 sites across
      # nearly every file), so a format pass wants its own commit — and one right now
      # would conflict across the unmerged feature/garage-bike-switch work.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The crate links against Tauri's webview stack, so a Linux build needs the
      # system libs even when we're only running tests. `libasound2-dev` is for voice
      # chat: cpal pulls in alsa-sys, whose build script shells out to pkg-config and
      # fails the whole job without it.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run tests
        # The Cargo workspace root is the repo root now, so this runs from there and
        # `--workspace` covers every member.
        # Tests needing a real MX Bikes asset are `#[ignore]`d and stay skipped here.
        # bash on Windows too, so the `--` reaches libtest rather than PowerShell.
        shell: bash
        run: cargo test --workspace --locked -- ${{ matrix.shard.filter }}

  # The two things paint sync depends on that nothing was checking. Both ship separately from
  # the app — the agent runs on someone else's machine, and the Worker used to be deployed by
  # hand — so a break in either surfaced only when a player hit it. The Worker half is now
  # `deploy-control-plane` below, which is gated on this job.
  control-plane:
    name: Control plane (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 refuses to run on anything older, and `wrangler types` is what
          # generates the `Env` the typecheck needs.
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `Env` comes from a generated `worker-configuration.d.ts` that is gitignored, so it
      # has to be regenerated before anything can typecheck.
      - name: Generate Worker types
        run: bunx wrangler types

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bunx vitest run

  # The deploy the comment above used to describe as "by hand".
  #
  # Gated on the job above, so nothing reaches api.mxbsecure.com that has not typechecked and
  # passed its tests, and restricted to `main`: a pull request builds and tests, it does not
  # ship. Every app in the field talks to this Worker, so the ordering is the safety.
  #
  # Migrations first, then code: a new table or column has to exist before the Worker that
  # reads it goes live. `d1_migrations` was backfilled on 2026-09-15 with every migration
  # already in production, so `migrations apply` runs only the new files. A migration that
  # fails is rolled back and stops the job before the deploy.
  deploy-control-plane:
    name: Control plane (deploy)
    needs: control-plane
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Named so branch protection can require a reviewer before a deploy, and so the Cloudflare
    # token can be scoped to this environment rather than the whole repository.
    environment: production
    # Not `cancel-in-progress`: a superseded test run is waste, a superseded deploy is a
    # half-finished release. Queue them instead.
    concurrency:
      group: deploy-control-plane
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Said plainly here rather than as whatever wrangler reports three minutes later: a
      # missing secret is the one failure of this job that is not about the code.
      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it as a repository secret,"\
                 "or under Settings -> Environments -> production. It needs Workers Scripts"\
                 "Edit and D1 Edit on the account."
            exit 1
          fi

      # The account id is optional: a token scoped to one account tells wrangler which, and
      # this repository is public, so the id is not written into it. Set the secret only if
      # the token can reach more than one account.
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"; fi
          bunx wrangler d1 migrations apply mxb-control-plane --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"; fi
          bunx wrangler deploy

      # The mod catalogue's background Worker (control-plane/mirror): the mxb-mods walker, the
      # mxb-mirror queue consumer and upload checks. Same database, so it goes after the
      # migrations above; after the control plane, so a new job shape is produced only once
      # something reads it. It holds no secrets. The token needs Queues Edit for its consumers.
      - name: Deploy the mirror worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"; fi
          bunx wrangler deploy -c mirror/wrangler.jsonc
