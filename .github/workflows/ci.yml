name: CI

# Verification on every push to main and every PR. Release builds (release.yml) only
# run on a tag, so without this nothing checks a change before it lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # `generate_handler!` takes a token list, so a command dropped from it is not a build
      # error — it is a runtime "command not found" on whichever screen needs it. Nothing
      # else in this pipeline can see that, and moving commands between crates is exactly
      # what invites it.
      - name: Command census
        run: bash scripts/command-census.sh

  rust:
    name: Rust (test) — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the quick check; Windows is what ships, so it must pass there too.
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cargo fmt --check` gate: the tree has never been rustfmt'd (~170 sites across
      # nearly every file), so a format pass wants its own commit — and one right now
      # would conflict across the unmerged feature/garage-bike-switch work.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The crate links against Tauri's webview stack, so a Linux build needs the
      # system libs even when we're only running tests. `libasound2-dev` is for voice
      # chat: cpal pulls in alsa-sys, whose build script shells out to pkg-config and
      # fails the whole job without it.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run tests
        # The Cargo workspace root is the repo root now, so this runs from there and
        # `--workspace` covers every member. `server-agent` is excluded from the
        # workspace and keeps its own job below.
        # Tests needing a real MX Bikes asset are `#[ignore]`d and stay skipped here.
        run: cargo test --workspace --locked

  # The two things paint sync depends on that nothing was checking. Both ship separately from
  # the app — the agent runs on someone else's machine, and the Worker used to be deployed by
  # hand — so a break in either surfaced only when a player hit it. The Worker half is now
  # `deploy-control-plane` below, which is gated on this job.
  control-plane:
    name: Control plane (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 refuses to run on anything older, and `wrangler types` is what
          # generates the `Env` the typecheck needs.
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `Env` comes from a generated `worker-configuration.d.ts` that is gitignored, so it
      # has to be regenerated before anything can typecheck.
      - name: Generate Worker types
        run: npx wrangler types

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  # The deploy the comment above used to describe as "by hand".
  #
  # Gated on the job above, so nothing reaches api.mxbsecure.com that has not typechecked and
  # passed its tests, and restricted to `main`: a pull request builds and tests, it does not
  # ship. Every app in the field talks to this Worker, so the ordering is the safety.
  #
  # Code only -- migrations stay manual, deliberately. `wrangler d1 migrations apply` decides
  # what to run from the `d1_migrations` table, and that table is empty on the production
  # database while all 28 migrations are in fact applied. An automatic apply would therefore
  # start at 0001 and fail on `table accounts already exists`, on every deploy, until someone
  # backfilled the bookkeeping. Adding a new table is also the one step that must happen
  # *before* the code that reads it, which is an ordering a single job cannot express.
  deploy-control-plane:
    name: Control plane (deploy)
    needs: control-plane
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Named so branch protection can require a reviewer before a deploy, and so the Cloudflare
    # token can be scoped to this environment rather than the whole repository.
    environment: production
    # Not `cancel-in-progress`: a superseded test run is waste, a superseded deploy is a
    # half-finished release. Queue them instead.
    concurrency:
      group: deploy-control-plane
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Said plainly here rather than as whatever wrangler reports three minutes later: a
      # missing secret is the one failure of this job that is not about the code.
      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under"\
                 "Settings -> Environments -> production. The token needs the"\
                 "'Edit Cloudflare Workers' template."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  bootstrap-script:
    # The one part of this repo that runs somewhere nobody can watch.
    #
    # Both scripts execute only as EC2 user-data on a Windows box with no console and no key
    # pair, where every failure path ends in `Stop-Computer` and takes the transcript with it.
    # They are also assembled by string interpolation -- a dozen escaped backticks and thirty
    # escaped backslashes -- so a mis-escaped one produces PowerShell that is malformed rather
    # than merely wrong, and `tsc` sees only a string either way. That is what this catches.
    #
    # It would not have caught the failures that actually lost builds so far: `-Tail -Raw` was
    # an invalid parameter set, the hand-built `agent.json` was valid PowerShell holding invalid
    # JSON, and `Start-BitsTransfer` failed at runtime. A parser sees none of those.
    name: Bootstrap script (parse)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./control-plane

      - name: Render the bootstrap scripts
        run: npm run render:bootstrap -- "${{ runner.temp }}"
        working-directory: ./control-plane

      - name: Parse them with PowerShell
        shell: pwsh
        run: |
          $bad = $false
          foreach ($name in @("bootstrap.ps1", "image-bootstrap.ps1")) {
            $path = Join-Path "${{ runner.temp }}" $name
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref] $null, [ref] $errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad = $true
              Write-Host "::error file=control-plane/src/bootstrap.ts::$name does not parse"
              foreach ($e in $errors) { Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)" }
            } else {
              Write-Host "$name parses"
            }
          }
          if ($bad) { exit 1 }

  server-agent:
    name: Server agent (test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server-agent -> target

      - name: Run tests
        working-directory: ./server-agent
        run: cargo test --locked
