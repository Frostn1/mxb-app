name: Release MXB Coach

# Build, sign and publish MXB Coach.
#
# Source lives in this repo; releases go to Frostn1/mxb-coach. Every installed app checks for
# its own updates against a repository's release list, and this repo's belongs to the manager:
# for as long as the coach released from here, each build had to be published as a GitHub
# pre-release so `releases/latest` — the manager's updater endpoint, baked into every install —
# never pointed at a coach. Its own repo ends that: the coach's releases are real releases,
# its version numbers stop appearing in the manager's list, and with its own signing key a
# leaked coach release token still cannot sign a manager update.
#
# Tags are `coach-v0.1.18` here and land as `v0.1.18` over there, so neither repo's tag
# namespace collides. `release.yml` triggers on `v*`, which does not match `coach-v*`.
#
# Installs from before the move look for `coach-v` releases in *this* repo, so the `bridge`
# job below gives them one: a pre-release carrying nothing but the signed `latest.json` from
# the release over there. See the job for when it can go.

on:
  push:
    tags:
      - "coach-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Pinned to 22.04 like the other apps: the AppImage inherits the builder's glibc.
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # bun installs the workspace from bun.lock, and tauri-action runs the app's
      # beforeBuildCommand (`bun run build`) with it too.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            squashfs-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release
          save-if: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The locked-content reader, as MXB App and Studio build with it: a GUID-locked track's
      # terrain and scenery then open for the 3D view. A fork builds without it, and the coach
      # draws the ground built from the laps instead.
      - name: Fetch private sidecar module
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        uses: actions/checkout@v4
        with:
          repository: Frostn1/mxbapp-private
          ssh-key: ${{ secrets.SIDECAR_DEPLOY_KEY }}
          path: .sidecar-src

      - name: Apply sidecar module
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        shell: bash
        run: bash .sidecar-src/sync.sh "$GITHUB_WORKSPACE"

      # Fail loudly rather than ship a coach that can't open locked tracks.
      - name: Check the sidecar module is in place
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        shell: bash
        run: |
          test -f crates/core/src/sidecar.rs || { echo "::error::sidecar.rs missing after sync.sh"; exit 1; }
          test -f crates/core/src/mxbsecure.rs || { echo "::error::mxbsecure.rs missing after sync.sh"; exit 1; }

      # `coach-v0.1.18-beta.18` → tag `v0.1.18-beta.18` over there, version `0.1.18-beta.18`.
      # A workflow_dispatch run has a branch for a ref, so it builds a throwaway version.
      - name: Tag without the coach- prefix
        id: tag
        shell: bash
        run: |
          raw="${{ github.ref_type == 'tag' && github.ref_name || format('coach-v0.0.{0}', github.run_number) }}"
          tag="${raw#coach-}"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The release page should say what shipped, not only which file to download — so the
      # body is composed from this tag's CHANGELOG section, the same one the changelog shows
      # under `## <date> — MXB Coach v…`. Falls back to the download guidance alone when the
      # version has no section yet.
      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            bash scripts/release-notes.sh "${{ steps.tag.outputs.name }}" --app="MXB Coach"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # UPX for the Windows binary pack (scripts/pack-binary.sh runs as the app's
      # beforeBundleCommand). Windows leg only; the script no-ops without it and without MXB_PACK.
      - name: Install UPX (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: choco install upx -y

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          # A fine-grained PAT with contents:write on mxb-coach only. Deliberately not
          # GITHUB_TOKEN: that cannot write to another repository.
          GITHUB_TOKEN: ${{ secrets.COACH_RELEASE_TOKEN }}
          VITE_APP_NAME: "MXB Coach"
          # Pack the Windows binary with UPX via the beforeBundleCommand (scripts/pack-binary.sh).
          # Windows leg only; empty elsewhere so the hook no-ops. See the script for the AV caveat.
          MXB_PACK: ${{ startsWith(matrix.platform, 'windows') && '1' || '' }}
          # The coach's own key, not the manager's: a leak here can't sign a manager update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.COACH_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.COACH_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signs this build's anonymous usage reports, so the control plane can tell a report
          # from one of our builds from a report from a script. Obfuscated into the binary by
          # crates/core/build.rs — not secrecy, since anyone can download the build and read
          # the pad, but it keeps the key off a `strings` dump. Unset expands to empty, which
          # build.rs drops, so a fork builds an unsigned variant rather than failing; the
          # endpoint takes unsigned reports until MXB_USAGE_REQUIRE_SIGNATURE is turned on.
          MXB_USAGE_KEY: ${{ secrets.MXB_USAGE_KEY }}
        with:
          owner: Frostn1
          repo: mxb-coach
          # Required when publishing across repositories: the action has no commit of its
          # own over there to hang the release off.
          releaseCommitish: main
          projectPath: apps/coach
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "MXB Coach ${{ steps.tag.outputs.version }}"
          # Named here rather than renamed afterwards: this applies before latest.json is
          # written, so the manifest and the assets cannot disagree.
          assetNamePattern: "MXB-Coach-[version]-[arch][ext]"
          # The signed manifest the coach's updater reads.
          includeUpdaterJson: true
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # A suffixed tag is a beta of the version it names. Unlike before the move, a plain
          # tag is a real release here: `releases/latest` in mxb-coach is the coach's own.
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # Installs from 0.1.3 to 0.1.17 shipped an updater that looks for `coach-v` releases in
  # *this* repo, and nothing can change that in a binary already on someone's machine. So
  # every release also gets a release here under its original `coach-v` tag, carrying only
  # the signed `latest.json` from the one over there — the manifest's download URLs point at
  # mxb-coach, which is public, so those installs update straight to the new build and from
  # then on look in the right place.
  #
  # Always a pre-release, so this repo's `releases/latest` stays on the manager. This job can
  # be deleted once no install older than the move is still checking in.
  bridge:
    needs: build
    if: ${{ github.repository == 'Frostn1/mxb-app' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish the update pointer for pre-move installs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COACH_REPO_TOKEN: ${{ secrets.COACH_RELEASE_TOKEN }}
        run: bash scripts/coach-update-bridge.sh "$GITHUB_REF_NAME"
