name: Release MXB Coach

# Build, sign and publish MXB Coach as a release of this repo, tagged `coach-v<version>`.
#
# Every Coach release is a GitHub pre-release, stable ones included, so this repo's
# `releases/latest` (the manager's updater endpoint, baked into every install) never points at
# one. The coach finds its own releases instead (core's update_channel, `coach-v` prefix):
# stable takes versions with no pre-release part, beta takes them all. The manager's beta
# channel only reads `v` tags, and `release.yml` triggers on `v*`, which `coach-v*` doesn't
# match, so neither app ever sees the other's builds.

on:
  push:
    tags:
      - "coach-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Pinned to 22.04 like the other apps: the AppImage inherits the builder's glibc.
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # bun installs the workspace from bun.lock, and tauri-action runs the app's
      # beforeBuildCommand (`bun run build`) with it too.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            squashfs-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release
          save-if: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The locked-content reader, as MXB App and Studio build with it: a GUID-locked track's
      # terrain and scenery then open for the 3D view. A fork builds without it, and the coach
      # draws the ground built from the laps instead.
      - name: Fetch private sidecar module
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        uses: actions/checkout@v4
        with:
          repository: Frostn1/mxbapp-private
          ssh-key: ${{ secrets.SIDECAR_DEPLOY_KEY }}
          path: .sidecar-src

      - name: Apply sidecar module
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        shell: bash
        run: bash .sidecar-src/sync.sh "$GITHUB_WORKSPACE"

      # Fail loudly rather than ship a coach that can't open locked tracks.
      - name: Check the sidecar module is in place
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        shell: bash
        run: |
          test -f crates/core/src/sidecar.rs || { echo "::error::sidecar.rs missing after sync.sh"; exit 1; }
          test -f crates/core/src/mxbsecure.rs || { echo "::error::mxbsecure.rs missing after sync.sh"; exit 1; }

      - name: Version without the coach- prefix
        id: tag
        shell: bash
        run: echo "name=${GITHUB_REF_NAME#coach-}" >> "$GITHUB_OUTPUT"

      # UPX for the Windows binary pack (scripts/pack-binary.sh runs as the app's
      # beforeBundleCommand). Windows leg only; the script no-ops without it and without MXB_PACK.
      - name: Install UPX (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: choco install upx -y

      - name: Build and publish pre-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_NAME: "MXB Coach"
          # Pack the Windows binary with UPX via the beforeBundleCommand (scripts/pack-binary.sh).
          # Windows leg only; empty elsewhere so the hook no-ops. See the script for the AV caveat.
          MXB_PACK: ${{ startsWith(matrix.platform, 'windows') && '1' || '' }}
          # The coach's own key, not the manager's: a leak here can't sign a manager update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.COACH_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.COACH_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signs this build's anonymous usage reports, so the control plane can tell a report
          # from one of our builds from a report from a script. Obfuscated into the binary by
          # crates/core/build.rs — not secrecy, since anyone can download the build and read
          # the pad, but it keeps the key off a `strings` dump. Unset expands to empty, which
          # build.rs drops, so a fork builds an unsigned variant rather than failing; the
          # endpoint takes unsigned reports until MXB_USAGE_REQUIRE_SIGNATURE is turned on.
          MXB_USAGE_KEY: ${{ secrets.MXB_USAGE_KEY }}
        with:
          projectPath: apps/coach
          tagName: ${{ github.ref_name }}
          releaseName: "MXB Coach ${{ steps.tag.outputs.name }}"
          releaseBody: |
            **MXB Coach beta.** Records your laps in MX Bikes and tells you, corner by corner, where you lose time and what to change.

            **Getting started**
            1. Install MXB Coach (Windows: the `.exe` below).
            2. Open **Settings** and press **Install** to add the recorder to MX Bikes. Restart the game if it's open.
            3. Ride a few laps, ideally in Testing. Every stint on track becomes a session.
            4. Open **Sessions**, pick the session and press **Review** on a lap. It's compared with your fastest whole lap on that track.

            The recorder only saves your laps. It changes nothing in the game.
          assetNamePattern: "MXB-Coach-[version]-[arch][ext]"
          # The signed manifest the coach's updater reads.
          includeUpdaterJson: true
          releaseDraft: false
          # Always, see the top of this file.
          prerelease: true
          args: ${{ matrix.args }}
