name: Release

# Build signed-less desktop bundles and publish them to a GitHub Release.
# Triggers on any tag like `v0.1.0`. You can also run it manually from the
# Actions tab (workflow_dispatch) to build without tagging. Releases are
# published, not drafted (`releaseDraft: false`).
#
# A tag with a suffix — `v0.7.0-beta.1`, `v0.7.0-rc.2` — builds the same three
# platforms but publishes as a PRE-RELEASE: GitHub keeps it off `releases/latest`,
# which is the endpoint the in-app updater reads, so existing installs are not
# offered it and the Discord announcement is held back. Beta testers install it by
# downloading the installer from the release page. Tagging the plain `v0.7.0`
# afterwards is what ships it to everyone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MX Bikes is Windows-only, so Windows is the primary artifact.
          - platform: windows-latest
            args: ""
          # macOS (Apple Silicon) build of the cross-platform download/extract UI.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Linux, for players running MX Bikes under Proton. Pinned to 22.04, not
          # `latest`: the AppImage inherits the builder's glibc as its floor, so
          # building on a newer runner would refuse to start on older distros.
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # Tauri links against the GTK/WebKit stack on Linux; `patchelf` is what the
      # AppImage bundler uses to rewrite the runtime paths. Mirrors ci.yml.
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Pull in the optional local module from the private repo so published builds
      # can decode real bike geometry. Read-only deploy key (SIDECAR_DEPLOY_KEY);
      # gated to the canonical repo so forks build the public (sidecar-less) variant.
      - name: Fetch private sidecar module
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        uses: actions/checkout@v4
        with:
          repository: Frostn1/mxbapp-private
          ssh-key: ${{ secrets.SIDECAR_DEPLOY_KEY }}
          path: .sidecar-src

      - name: Apply sidecar module
        if: ${{ github.repository == 'Frostn1/mxb-app' }}
        shell: bash
        run: bash .sidecar-src/sync.sh "$GITHUB_WORKSPACE"

      # The release page should say what shipped, not only which file to download — so
      # the body is composed from this tag's CHANGELOG section. Same section the Discord
      # announcement reads, so the two can't drift apart.
      - name: Compose release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            bash scripts/release-notes.sh "$TAG"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Frontend reads this at build time (see .env.production).
          VITE_APP_NAME: "MXB App"
          # Sign the updater artifacts so the app can verify self-updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: "MXB App ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          # What shipped, then which file to download — worded in scripts/release-notes.sh.
          # The download half describes files by extension, since exact filenames drift
          # when the `finalize` job renames the assets.
          releaseBody: ${{ steps.notes.outputs.body }}
          # Publish straight away (not a draft) so the updater's `latest.json`
          # endpoint (releases/latest) resolves without a manual publish step.
          releaseDraft: false
          # A suffixed tag (`v0.7.0-beta.1`) is a beta: same artifacts, but flagged
          # pre-release so `releases/latest` — and with it every installed app's update
          # check — stays on the last full release until the plain tag is cut.
          # A manual `workflow_dispatch` build is never the release everyone should get.
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # Tauri names bundles like `MXB.App_0.1.0_x64-setup.exe`, which reads as ugly/
  # fishy. Rename the user-facing installers to `MXB-App-<ver>-<arch>.<ext>` and
  # repoint latest.json at them. Signatures live inside latest.json and are over
  # file *content* (unchanged by a rename), so self-update keeps verifying.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rename installers + patch latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; cd "$work"
          gh release download "$TAG" -R "$REPO" -p latest.json -O latest.json --clobber || true
          for name in $(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name'); do
            case "$name" in
              # The .rpm is named `mxb-app-<ver>-1.x86_64.rpm` by convention and is
              # deliberately left alone. latest.json's Linux entry points at the
              # AppImage, and the sed below keeps it pointing at the renamed one.
              MXB.App_*.exe|MXB.App_*.dmg|MXB.App_*.exe.sig|MXB.App_*.dmg.sig|MXB.App_*.AppImage|MXB.App_*.AppImage.sig|MXB.App_*.deb)
                new="$(printf '%s' "$name" | sed -e 's/MXB\.App/MXB-App/' -e 's/_/-/g' -e 's/-setup//')"
                [ "$name" = "$new" ] && continue
                echo "rename: $name -> $new"
                gh release download "$TAG" -R "$REPO" -p "$name" -O "$new" --clobber
                gh release delete-asset "$TAG" "$name" -R "$REPO" -y
                gh release upload "$TAG" "$new" -R "$REPO" --clobber
                [ -f latest.json ] && sed -i "s#${name}#${new}#g" latest.json
                ;;
            esac
          done
          if [ -f latest.json ]; then
            gh release upload "$TAG" latest.json -R "$REPO" --clobber
          fi

  # Announce the finished release in Discord. Runs after `finalize` so the download links
  # point at the renamed installers, and only for real tags on the canonical repo — forks
  # stay silent, and `workflow_dispatch` test builds (throwaway `v<run_number>` tags) don't
  # spam the channel. Pre-release tags stay quiet too: a beta goes to the people who asked
  # for it, and the channel hears about the version once, when everyone can have it.
  # (`scripts/notify-discord.sh <tag> --print` renders the message without sending it.)
  notify:
    needs: finalize
    if: ${{ github.repository == 'Frostn1/mxb-app' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post release announcement to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Missing secret is a warning, not a failure — see the script.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/notify-discord.sh "${{ github.ref_name }}"
